name: Release checks

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          package-manager-cache: false
      - name: Install committed dependencies
        run: npm ci
      - name: Generate disposable signing secret
        run: |
          test_signing_secret=$(openssl rand -hex 32)
          echo "::add-mask::$test_signing_secret"
          echo "AUTH_SECRET=$test_signing_secret" >> "$GITHUB_ENV"
      - name: Lint, route types, TypeScript and database tests
        run: npm run check
      - name: Production build (default compiler)
        run: npm run build
      - name: Verify production fails closed on missing configuration
        run: npm run test:production-config
      - name: Production dependency advisory check
        run: npm audit --omit=dev
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Isolated development browser regressions
        run: npm run test:e2e
      - name: Retain synthetic failure screenshots only
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthetic-browser-failures
          path: test-results/**/*.png
          retention-days: 3
          if-no-files-found: ignore
